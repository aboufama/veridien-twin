    rho_d: {value: [0.01, 0.01, 0.01], unit: "linear sRGB", status: assumed, source: "dark lens barrel behind the front element"}
    roughness: {value: 0.02, unit: "-", status: assumed, source: "polished"}
    ior: {value: 1.22, unit: "-", status: assumed, source: "EFFECTIVE index giving F0 = 1.0 % for an AR-coated front element (bare crown glass n 1.52, F0 4.3 %). Whether the M12 lens is coated is unmeasured"}
    fresnel_avg: {value: 0.0478, unit: "-", status: assumed, source: "derived from ior"}
    metallic: {value: 0, unit: "-", status: published, source: "dielectric"}
  emitter:
    model: {value: emitter, unit: "-", status: published, source: "contract §8: L_e(omega) = L0 p(theta) on mesh scope_light, one-sided, emitting into the tip-face normal hemisphere"}
    L0: {value: [10091.9, 9193.2, 8830.7], unit: "W sr^-1 m^-2 per linear-sRGB channel", status: assumed, source: "derived (doc §2.4): Y0 = flux / (683 A_face int p cos dw) = 9358.1, times srgb_chromaticity. Scales linearly with flux_at_scope_tip"}
    luminance_axial: {value: 6.392e+6, unit: cd/m^2, status: assumed, source: "derived: 683 Y0"}
    profile: {value: light.profile, unit: "-", status: assumed, source: "reference to light.profile"}
    spectral_scale_physical: {value: 193.18, unit: "W sr^-1 m^-2 nm^-1 per unit relative_spd", status: assumed, source: "derived: L(lambda) = (Y0 / integral_spd_ybar) relative_spd(lambda); its ybar integral is Y0"}
    spectral_scale_mitsuba: {value: 20622.0, unit: "Mitsuba spectrum units per unit relative_spd", status: assumed, source: "derived: Mitsuba 3.9 divides the ybar integral by 106.75026 (MI_CIE_Y_NORMALIZATION, include/mitsuba/core/spectrum.h), so scale = Y0 x 106.75026 / 48.4414. Use with relative_spd for *_spectral runs"}
    rho_d: {value: [0.02, 0.02, 0.02], unit: "linear sRGB", status: assumed, source: "polished fibre ends: light entering them is mostly guided away"}
