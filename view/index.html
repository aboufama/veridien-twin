<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dome twin</title>
<link rel="stylesheet" href="view.css">
</head>
<body>
<header id="bar">
  <p id="status" role="status" aria-live="polite" hidden></p>
  <p id="hint" aria-live="polite"></p>
  <nav id="tools">
    <button id="grid-btn" type="button" aria-pressed="false" title="Show the four views (V)">4 views</button>
    <button id="help-btn" type="button" aria-expanded="false" title="Keys (?)">?</button>
  </nav>
</header>
<main id="stage">
  <section id="main-view" class="frame" tabindex="0" aria-label="Main view">
    <canvas class="img" width="1280" height="720"></canvas>
    <canvas class="ov"></canvas>
    <p class="note" hidden></p>
  </section>
  <section id="grid" hidden></section>
</main>
<aside id="help" hidden>
  <dl id="keys"></dl>
</aside>
<p id="boot">Loading the twin</p>
<script type="module" src="view.js"></script>
</body>
</html>
